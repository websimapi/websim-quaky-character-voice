<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quaky Character Voice</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f0f8ff;
            color: #333;
        }
        h1 {
            color: #ff4500;
            text-shadow: 2px 2px #ffd700;
        }
        p {
            font-size: 1.2em;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            max-width: 600px;
            margin: 30px auto;
        }
        button {
            padding: 20px;
            font-size: 18px;
            cursor: pointer;
            border: 3px solid #ffd700;
            background-color: #ffdead;
            color: #d2691e;
            font-weight: bold;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px #cd853f;
        }
        button:hover {
            background-color: #ffc04d;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #cd853f;
        }
    </style>
</head>
<body>

    <h1>Quaky Character Voice</h1>
    <p>Click the buttons to hear the character speak!</p>

    <div class="button-grid">
        <button data-sound="lets_go.mp3">Let's Go!</button>
        <button data-sound="laugh.mp3">Laugh</button>
        <button data-sound="gotcha.mp3">Gotcha!</button>
        <button data-sound="oops.mp3">Oops!</button>
        <button data-sound="what.mp3">What?</button>
        <button data-sound="yippee.mp3">Yippee!</button>
        <button data-sound="cant_catch_me.mp3">You can't catch me!</button>
        <button data-sound="adventure_time.mp3">Time for an adventure!</button>
        <button data-sound="king_of_the_castle.mp3">I'm the king of the castle!</button>
    </div>

    <script>
        let audioContext;
        const audioBufferCache = {};

        function initAudio() {
            if (!audioContext) {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.error("Web Audio API is not supported in this browser");
                    alert("Web Audio API is not supported in this browser");
                }
            }
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        async function loadSound(url) {
            if (audioBufferCache[url]) {
                return audioBufferCache[url];
            }
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                audioBufferCache[url] = audioBuffer;
                return audioBuffer;
            } catch (error) {
                console.error(`Loading sound failed for ${url}:`, error);
            }
        }

        function playSound(buffer) {
            if (!buffer || !audioContext) return;
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start(0);
        }

        async function playSoundFromButton(soundUrl) {
            initAudio();
            const buffer = await loadSound(soundUrl);
            playSound(buffer);
        }

        document.querySelectorAll('.button-grid button').forEach(button => {
            button.addEventListener('click', () => {
                const soundFile = button.getAttribute('data-sound');
                playSoundFromButton(soundFile);
            });
            // Preload sounds on mouseover for faster playback on click
            button.addEventListener('mouseover', () => {
                 initAudio();
                 const soundFile = button.getAttribute('data-sound');
                 loadSound(soundFile);
            }, { once: true });
        });

        // Add a one-time event listener to initialize audio context on the first user interaction
        document.body.addEventListener('click', initAudio, { once: true });
        document.body.addEventListener('touchstart', initAudio, { once: true });

    </script>

</body>
</html>
